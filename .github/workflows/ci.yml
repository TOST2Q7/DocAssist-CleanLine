name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:file
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: single-file
          path: dist-file/*.html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match package.json version
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - uses: actions/download-artifact@v4
        with:
          name: single-file
          path: dist-file
      # The release may already exist if it was created in the GitHub UI.
      - run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-file/*.html --clobber
          else
            gh release create "$TAG" dist-file/*.html --generate-notes
          fi
